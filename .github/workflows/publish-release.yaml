name: Publish release after release PR merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.title, 'chore(release): v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Could not determine version from package.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        working-directory: ./${{ vars.PROJECT_DIRECTORY }}

      - name: Verify branch version matches merged version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BRANCH_VERSION="${HEAD_REF#release/v}"
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release branch version ($BRANCH_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Verify PR title matches merged version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          EXPECTED_TITLE="chore(release): v${{ steps.version.outputs.version }}"
          if [ "$PR_TITLE" != "$EXPECTED_TITLE" ]; then
            echo "PR title ($PR_TITLE) does not match expected title ($EXPECTED_TITLE)"
            exit 1
          fi

      - name: Check whether tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if tag already exists
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Tag already exists: ${{ steps.version.outputs.tag }}"
          exit 1

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes