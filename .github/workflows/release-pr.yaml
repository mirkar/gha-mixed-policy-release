name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Optional explicit version bump: major, minor, patch, or exact version like 1.2.3'
        required: false
        type: string
      dry_run:
        description: 'Preview only without pushing branch or opening PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      - name: Check project path variable
        run: |
          if [ -z "${{ vars.PROJECT_DIRECTORY }}" ]; then
            echo "PROJECT_DIRECTORY variable is not set. Please set it in the repository settings."
            exit 1
          else
            echo "PROJECT_DIRECTORY is set to '${{ vars.PROJECT_DIRECTORY }}'"
          fi
          echo "${{ github.workspace }}/${{ vars.PROJECT_DIRECTORY }}/package-lock.json
          ls -la "${{ github.workspace }}/${{ vars.PROJECT_DIRECTORY }}/package-lock.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/${{ vars.PROJECT_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./${{ vars.PROJECT_DIRECTORY }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync main and tags
        run: |
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main
