name: Prepare release PR
run-name: Prepare release PR ${{ inputs.dry_run && '- Preview only' || '' }}

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Optional explicit version bump: major, minor, patch, or exact version like 1.2.3'
        required: false
        type: string
      dry_run:
        description: 'Preview only without pushing branch or opening PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      - name: Check project path variable
        run: |
          if [ -z "${{ vars.PROJECT_DIRECTORY }}" ]; then
            echo "PROJECT_DIRECTORY variable is not set. Please set it in the repository settings."
            exit 1
          else
            echo "PROJECT_DIRECTORY is set to '${{ vars.PROJECT_DIRECTORY }}'"
          fi
          echo "${{ github.workspace }}/${{ vars.PROJECT_DIRECTORY }}/package-lock.json"
          ls -la "${{ github.workspace }}/${{ vars.PROJECT_DIRECTORY }}/package-lock.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/${{ vars.PROJECT_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./${{ vars.PROJECT_DIRECTORY }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync main and tags
        run: |
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

      - name: Fail if latest commit is already tagged
        run: |
          # This check prevents creating a release PR when the latest commit on main is already tagged as release, 
          # which means that there is no new commit in main branch to release.
          # The command checks if your current commit (HEAD) has a tag directly attached to it.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "::error title=No new commits to release::The latest commit in main branch is already tagged as release. Please create a new commit in main branch using PR before running this workflow."
            exit 1
          fi

      - name: Fail if another open release PR already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh pr list \
            --base main \
            --state open \
            --label release \
            --json number \
            --jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Existing release PR detected::There is already an open release PR targeting main."
            echo "Close or merge the existing release PR before creating a new one."
            gh pr list --base main --state open --label release
            exit 1
          fi

      - name: Run commit-and-tag-version
        id: bump
        run: |
          npm install -g commit-and-tag-version@12.x
          if [ -n "${{ inputs.release_as }}" ]; then
            npx commit-and-tag-version --release-as "${{ inputs.release_as }}" --skip.tag
          else
            npx commit-and-tag-version --skip.tag
          fi

          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v$VERSION"
          TITLE="chore(release): v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
        working-directory: ./${{ vars.PROJECT_DIRECTORY }}


      - name: Show Changelog Diff
        run: |
          echo -e "\033[1;33mGenerated CHANGELOG.md diff:\033[0m"
          git --no-pager diff --color=always -- ./${{ vars.PROJECT_DIRECTORY }}/CHANGELOG.md || echo "No changes in CHANGELOG.md"

      - name: Show generated changes
        run: |
          echo "Prepared version: v${{ steps.bump.outputs.version }}"
          git status --short
          git --no-pager log --oneline -1
          echo -e "\033[1;33mCHANGELOG.md content:\033[0m"
          cat $GITHUB_WORKSPACE/${{ vars.PROJECT_DIRECTORY }}/CHANGELOG.md

      - name: Stop after preview
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run requested. Stopping before branch creation."
          exit 0

      - name: Check whether release branch already exists
        if: ${{ inputs.dry_run == false }}
        id: branch_exists
        run: |
          if git ls-remote --exit-code --heads origin "${{ steps.bump.outputs.branch }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if release branch already exists
        if: ${{ inputs.dry_run == false && steps.branch_exists.outputs.exists == 'true' }}
        run: |
          echo "Release branch already exists: ${{ steps.bump.outputs.branch }}"
          echo "Delete it or merge the related PR before creating a new release branch."
          exit 1

      - name: Create release branch
        if: ${{ inputs.dry_run == false && steps.branch_exists.outputs.exists == 'false' }}
        run: |
          git checkout -b "${{ steps.bump.outputs.branch }}"

      - name: Push release branch
        if: ${{ inputs.dry_run == false && steps.branch_exists.outputs.exists == 'false' }}
        run: |
          git push --set-upstream origin "${{ steps.bump.outputs.branch }}"

      - name: Create release PR
        if: ${{ inputs.dry_run == false && steps.branch_exists.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL_ARGS=()
          if gh label list --limit 200 --json name --jq '.[].name' | grep -Fxq "release"; then
            LABEL_ARGS+=(--label release)
          else
            echo "Label 'release' not found. Creating PR without label."
          fi

          gh pr create \
            --base main \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "${{ steps.bump.outputs.title }}" \
            "${LABEL_ARGS[@]}" \
            --body "$(cat <<EOF
          This PR prepares release **v${{ steps.bump.outputs.version }}**.

          Generated by GitHub Actions using \`commit-and-tag-version\`.

          Includes:
          - version bump
          - \`CHANGELOG.md\` update
          - lockfile/version file updates if applicable

          After merge, the publish workflow will:
          - create tag \`v${{ steps.bump.outputs.version }}\`
          - create the GitHub Release
          EOF
          )"          