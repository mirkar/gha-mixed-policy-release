# This GitHub Action validates that pull request titles follow the Conventional Commits format.
# It is triggered on pull requests targeting the main branch when they are opened or edited.
name: Validate PR Title

# Concurrency settings to prevent multiple validations on the same PR
# This ensures that if GitHub fires an edited and a synchronize event at 
# the exact same second for the same PR, the engine will immediately cancel 
# the first run and only execute the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    types: [opened, edited, synchronize, reopened]
# on:
#   pull_request:
#     types: [opened, edited, synchronize]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Regex Check
        uses: actions/github-script@v7
        with:
          script: |
            // Define ANSI text styles
            const red = '\u001b[31m';
            const green = '\u001b[32m';
            const yellow = '\u001b[33m';
            const blue = '\u001b[34m';
            const bold = '\u001b[1m';
            const reset = '\u001b[0m';          
            const title = context.payload.pull_request.title;
            const regex = /^(feat|fix|docs|style|refactor|test|build|chore)(\(.+\))?: .{1,50}/;
            if (!regex.test(title)) {
              core.warning(`${yellow}⚠️ PR title does not follow Conventional Commits format.${reset}`);
              core.info(`${blue}Expected format:${reset} <type>[(scope)][!]: <description>`);
              core.info(`${blue}Where:${reset}`);
              core.info(`${bold}${blue}- type:${reset} feat, fix, docs, style, refactor, test, build, chore`);
              core.info(`${bold}${blue}- scope:${reset} optional, describes the section of the codebase`);
              core.info(`${bold}${blue}- description:${reset} brief summary of the change (max 50 chars)`);
              core.info(`${bold}${blue}- !:${reset} optional, indicates a breaking change`);
              core.info(`${bold}${blue}Example:${reset} feat(auth)!: add new login method`);
              core.setFailed(`Invalid PR title: "${title}". Must match Conventional Commits format.`);
            } else {
              core.info(`${green}✅ PR title is valid: "${title}"${reset}`);
            }